    <g data-record="28"><defs><clipPath id="altium-text-frame-PSKYVZQQ"><rect x="222.5" y="542.5" width="250" height="10"/></clipPath></defs><text x="223" y="555" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PSKYVZQQ)"><tspan x="223" dy="0">Reviews completed</tspan></text></g>
