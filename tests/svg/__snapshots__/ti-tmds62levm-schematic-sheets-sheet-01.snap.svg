    <g data-record="28"><defs><clipPath id="altium-text-frame-UBSZWHLP"><rect x="222.5" y="762.5" width="250" height="20"/></clipPath></defs><text x="223" y="775" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-UBSZWHLP)"><tspan x="223" dy="0">Recommendations</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QZDYVISA"><rect x="502.5" y="432.5" width="260" height="70"/></clipPath></defs><text x="503" y="445" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QZDYVISA)"><tspan x="503" dy="0">We have customer requesting for</tspan><tspan x="503" dy="12">Altium files and using the .ALG</tspan><tspan x="503" dy="12">files. The .ALG file is an</tspan><tspan x="503" dy="12">intermediate converted file</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QRGTJQXI"><rect x="502.5" y="482.5" width="260" height="70"/></clipPath></defs><text x="503" y="495" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QRGTJQXI)"><tspan x="503" dy="0">The Altium converted schematics and</tspan><tspan x="503" dy="12">PCB files provided has most of the</tspan><tspan x="503" dy="12">constraints translated and close</tspan><tspan x="503" dy="12">the Orcad/Allegro design files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-GWZJKZKJ"><rect x="502.5" y="542.5" width="260" height="30"/></clipPath></defs><text x="503" y="555" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-GWZJKZKJ)"><tspan x="503" dy="0">schematic, layout , footprint</tspan><tspan x="503" dy="12">review</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PLJSUCKK"><rect x="502.5" y="582.5" width="260" height="30"/></clipPath></defs><text x="503" y="595" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PLJSUCKK)"><tspan x="503" dy="0">The simulations have been performed</tspan><tspan x="503" dy="12">on Orcad/Allegro design files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-AUQLVQKB"><rect x="502.5" y="622.5" width="260" height="40"/></clipPath></defs><text x="503" y="635" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-AUQLVQKB)"><tspan x="503" dy="0">Refer to</tspan><tspan x="503" dy="12">Proc180E1-1_Altium_Folders_Files_List</tspan><tspan x="503" dy="12">document in the download Zip file</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DKWWXPOE"><rect x="500.5" y="677.5" width="260" height="70"/></clipPath></defs><text x="501" y="690" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DKWWXPOE)"><tspan x="501" dy="0">The required reviews for the</tspan><tspan x="501" dy="12">converted files have been provided.</tspan><tspan x="501" dy="12">The boards have not been built and</tspan><tspan x="501" dy="12">tested. Orcad/Allegro design-based</tspan><tspan x="501" dy="12">boards have been built and tested.</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DJTAIBER"><rect x="502.5" y="752.5" width="260" height="70"/></clipPath></defs><text x="503" y="765" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DJTAIBER)"><tspan x="503" dy="0">Customer can use the files to make</tspan><tspan x="503" dy="12">the required updates. The</tspan><tspan x="503" dy="12">recommendation is for customer to</tspan><tspan x="503" dy="12">perform a detailed review to ensure</tspan><tspan x="503" dy="12">there are no errors before start of</tspan><tspan x="503" dy="12">board builds</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PUIJZZFO"><rect x="532.5" y="332.5" width="260" height="20"/></clipPath></defs><text x="533" y="345" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PUIJZZFO)"><tspan x="533" dy="0">Comments</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-GWSOAMNP"><rect x="232.5" y="322.5" width="260" height="20"/></clipPath></defs><text x="233" y="335" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-GWSOAMNP)"><tspan x="233" dy="0">Queries and Notes</tspan></text></g>
