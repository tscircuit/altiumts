    <g data-record="28"><defs><clipPath id="altium-text-frame-VNFZYWQJ"><rect x="222.5" y="372.5" width="250" height="30"/></clipPath></defs><text x="223" y="385" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-VNFZYWQJ)"><tspan x="223" dy="0">Design files referenced to</tspan><tspan x="223" dy="12">generate Altium files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-WDACUCLV"><rect x="502.5" y="372.5" width="260" height="70"/></clipPath></defs><text x="503" y="385" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-WDACUCLV)"><tspan x="503" dy="0">AM62L EVM design files on TI.com</tspan><tspan x="503" dy="12">have been used for converting the</tspan><tspan x="503" dy="12">Orcad/Allegro design to Altium</tspan><tspan x="503" dy="12">design files</tspan></text></g>
