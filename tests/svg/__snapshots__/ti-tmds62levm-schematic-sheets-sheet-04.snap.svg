    <g data-record="28"><defs><clipPath id="altium-text-frame-RVBPPGEU"><rect x="280.7" y="660.7" width="1475" height="36"/></clipPath></defs><text x="281.2" y="679.2" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="18" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-RVBPPGEU)"><tspan x="281.2" dy="0">https://e2e.ti.com/support/processors-group/processors/f/processors-forum/1285107/faq-am64x-am243x-am62x-am62ax-am62px-am62d-q1-am62l-custom-board-</tspan><tspan x="281.2" dy="18">hardware-design---collaterals-for-reference-during-schematic-design-and-schematics-review</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-XDBCRCNA"><rect x="280.7" y="710.7" width="1495" height="36"/></clipPath></defs><text x="281.2" y="729.2" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="18" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-XDBCRCNA)"><tspan x="281.2" dy="0">https://e2e.ti.com/support/processors-group/processors/f/processors-forum/1478030/faq-am62l-custom-board-hardware-design---faqs-related-to-processor-</tspan><tspan x="281.2" dy="18">collaterals-functioning-peripherals-interface-and-evm</tspan></text></g>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 238.7) rotate(0)">AM62L EVM (TMDS62LEVM):</text>
    <text data-record="4" x="0" y="0" fill="#000042" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 256.7) rotate(0)">https://www.ti.com/product/AM62L</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 288.7) rotate(0)">AM62Lx Sitara™ Processors datasheet :</text>
    <text data-record="4" x="0" y="0" fill="#000042" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 306.7) rotate(0)">https://www.ti.com/lit/pdf/SPRSPA1</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 338.7) rotate(0)">Hardware Design Considerations :</text>
    <text data-record="4" x="0" y="0" fill="#000042" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 356.7) rotate(0)">https://www.ti.com/lit/pdf/SPRUJC9</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(630.7 488.7) rotate(0)">SK-AM62B, SK-AM62B-P1, SK-AM62-LP, SK-AM62-SIP, TMDS62LEVM, SK-AM62A-LP, SK-AM62P-LP</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 488.7) rotate(0)">SKs (Starter Kits) for reference :</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 388.7) rotate(0)">DDR Board Design and Layout Guidelines :</text>
    <text data-record="4" x="0" y="0" fill="#000042" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 406.7) rotate(0)">https://www.ti.com/lit/pdf/sprad06</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 438.7) rotate(0)">Schematic Design and Review Checklist for AM62Lx processor family :</text>
    <text data-record="4" x="0" y="0" fill="#000042" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 456.7) rotate(0)">https://www.ti.com/lit/pdf/SPRADO8</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="18" font-style="normal" font-weight="normal" text-decoration="underline" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(280.7 778.7) rotate(0)">https://e2e.ti.com/support/processors-group/processors/f/processors-forum/1478025/faq-am62l-custom-board-hardware-design---reusing-ti-evm-design-files</text>
    <text data-record="4" x="0" y="0" fill="#0000ff" font-family="Calibri" font-size="39" font-style="normal" font-weight="bold" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(642.7 1097.7) rotate(0)">COMMON SOC LVCMOS IO INTERFACE GUIDELINES</text>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PPMUOTRL"><rect x="331.7" y="1404.7" width="1425" height="48"/></clipPath></defs><text x="332.2" y="1421.2" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PPMUOTRL)"><tspan x="332.2" dy="0">Verify cap loading of the SOC output (when any cap value &gt; 22 pF (use case dependent, max value) is connected, customer needs to simulate), </tspan><tspan x="332.2" dy="16">slew rate of the input signal (LVCMOS input slew should be 1000 ns or less), IO compatibility and fail-safe operation between the SOC IOs and </tspan><tspan x="332.2" dy="16">attached devices.</tspan></text></g>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(331.7 1140.7) rotate(0)">Most of the SOC IOs are not fail-safe. No input should be applied before supply ramps.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(331.7 1180.7) rotate(0)">SOC LVCOMOS IOs have slew rate requirements specified, applying a slow ramp input or connecting a cap at the input is not recommended.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(331.7 1220.7) rotate(0)">Connecting a cap load 50 pF or more at the output is not recommended. DNI cap or perform simulations based on the use case.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(331.7 1260.7) rotate(0)">SOC IO buffers are off during Reset. A pull is required near to the attached device being driven by the SOC IO that could float.</text>
    <g data-record="28"><defs><clipPath id="altium-text-frame-CWVHLLNC"><rect x="331.7" y="1284.7" width="1295" height="32"/></clipPath></defs><text x="332.2" y="1301.2" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-CWVHLLNC)"><tspan x="332.2" dy="0">Any SOC IO that has a trace connected needs a parallel pull. When adding pull is not feasible, ensure the traces are routed away </tspan><tspan x="332.2" dy="16">from noisy signals.</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-VGNBUSHX"><rect x="331.7" y="1334.7" width="1445" height="48"/></clipPath></defs><text x="332.2" y="1351.2" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-VGNBUSHX)"><tspan x="332.2" dy="0">Connecting SOC IOs that have alternate function that can be configured directly to supply or ground is not allowed or recommended </tspan><tspan x="332.2" dy="16">(including bootmode inputs). (Customer could have bug with their firmware and mis-configure these LVCMOS GPIOs that were intended to be inputs, </tspan><tspan x="332.2" dy="16">to be outputs driven logic high instead).</tspan></text></g>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1140.7) rotate(0)">1.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1180.7) rotate(0)">2.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1220.7) rotate(0)">3.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1260.7) rotate(0)">4.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1300.7) rotate(0)">5.</text>
    <text data-record="4" x="0" y="0" fill="#1f2937" font-family="Courier New" font-size="16" font-style="normal" font-weight="normal" text-decoration="none" text-anchor="start" dominant-baseline="text-after-edge" transform="translate(291.7 1350.7) rotate(0)">6.</text>
